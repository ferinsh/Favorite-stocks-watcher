services:
  db:
    image: postgres:16
    container_name: stock_portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: